
name: Build Moto E7 Plus Kernel

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Kernel build name"
        required: false
        default: "Guam-Custom"
        type: string
      enable_ksu:
        description: "Enable KernelSU Next"
        required: false
        default: true
        type: boolean

  push:
    branches:
      - lineage-24.0

jobs:
  build:
    name: Build Kernel for Moto E7 Plus
    runs-on: ubuntu-22.04

    env:
      ENABLE_KSU: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_ksu }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential \
            ccache curl flex git \
            libssl-dev libelf-dev \
            libncurses-dev lld llvm clang \
            python3 python3-pip \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            device-tree-compiler \
            zip unzip

      - name: Show Compiler Version
        run: clang --version

      - name: Integrate KernelSU Next
        if: ${{ env.ENABLE_KSU == 'true' }}
        run: |
          set -euo pipefail

          curl -fLSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            -o /tmp/ksu-setup.sh

          bash /tmp/ksu-setup.sh legacy

          echo "=== KernelSU Next version ==="
          git -C KernelSU-Next log -1 --oneline

          test -f drivers/kernelsu/Kconfig
          ls -la drivers/kernelsu

      - name: Configure Kernel
        run: |
          set -euo pipefail
          mkdir -p out

          ARCH=arm64 scripts/kconfig/merge_config.sh \
            -m -O out \
            arch/arm64/configs/vendor/bengal-perf_defconfig \
            arch/arm64/configs/vendor/ext_config/moto-bengal.config \
            arch/arm64/configs/vendor/ext_config/guam-default.config

          if [ "$ENABLE_KSU" = "true" ]; then
            scripts/config --file out/.config \
              --enable KSU \
              --enable KPROBES \
              --enable KPROBE_EVENTS \
              --enable KSU_KPROBES_HOOK
          else
            scripts/config --file out/.config \
              --disable KSU
          fi

          make O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          echo "=== KernelSU configuration ==="
          grep -E 'CONFIG_KSU|CONFIG_KPROBE' out/.config || true

          if [ "$ENABLE_KSU" = "true" ]; then
            grep -qx 'CONFIG_KSU=y' out/.config
            grep -qx 'CONFIG_KPROBES=y' out/.config
            grep -qx 'CONFIG_KSU_KPROBES_HOOK=y' out/.config
          fi

      - name: Diagnose Android Vendor Hooks
        run: |
          echo "=== Vendor hook source files ==="
          find . -iname '*vendor*hook*' -o -iname '*hooks*.c'

          echo "=== Hook definitions ==="
          grep -Rns 'android_vh_set_memory_ro' \
            include drivers kernel arch || true

          echo "=== Hook configuration ==="
          grep -E 'CONFIG_ANDROID_VENDOR_HOOKS|CONFIG_TRACEPOINTS|CONFIG_ANDROID' \
            out/.config || true

      - name: Build Kernel
        run: |
          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbs

      - name: Check Device Tree Outputs
        run: |
          echo "=== Motorola base DTB ==="
          find out -name "bengal-moto-base.dtb"

          echo "=== Guam overlays ==="
          find out -name "bengal-guam-*.dtbo"

          echo "=== Device tree configuration ==="
          grep -E 'CONFIG_MMI_DEVICE_DTBS|CONFIG_GUAM_DTB|CONFIG_BUILD_ARM64_DT_OVERLAY' \
            out/.config || true

      - name: Collect Kernel Files
        run: |
          mkdir -p artifacts

          find out/arch/arm64/boot -type f \
            \( -name "Image" \
            -o -name "Image.gz" \
            -o -name "Image.gz-dtb" \
            -o -name "*.dtb" \
            -o -name "*.dtbo" \) \
            -exec cp --parents {} artifacts/ \;

          cp out/.config artifacts/kernel.config
          cp out/System.map artifacts/
          clang --version > artifacts/compiler.txt
          git rev-parse HEAD > artifacts/source-commit.txt
          echo "$ENABLE_KSU" > artifacts/kernelsu-enabled.txt

          test -s out/arch/arm64/boot/Image

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moto-E7-Plus-${{ inputs.build_name || 'Guam-Custom' }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 9
