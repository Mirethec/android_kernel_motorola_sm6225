
name: Build Moto E7 Plus Kernel

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Kernel build name"
        required: false
        default: "Guam-Custom"
        type: string
      enable_ksu:
        description: "Enable KernelSU Next"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - lineage-24.0
      - guam-touchscreen-fix

jobs:
  build:
    name: Build Kernel for Moto E7 Plus
    runs-on: ubuntu-22.04

    env:
      ENABLE_KSU: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_ksu }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve original config and checkout ROM source
        run: |
          cp .github/guam-original.config "$RUNNER_TEMP/guam-original.config"
          git checkout --detach 1da2d0861244d324cfff0fcb31dec374dd94436b
          git submodule update --init --recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential \
            ccache curl flex git \
            libssl-dev libelf-dev \
            libncurses-dev lld llvm clang \
            python3 python3-pip \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            device-tree-compiler \
            zip unzip

      - name: Install original Android Clang
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 "$RUNNER_TEMP/android-clang"
          git -C "$RUNNER_TEMP/android-clang" sparse-checkout set clang-r596125
          CLANG_DIR="$RUNNER_TEMP/android-clang/clang-r596125/bin"
          test -x "$CLANG_DIR/clang"
          "$CLANG_DIR/clang" --version | tee /tmp/compiler-version
          grep -F 'clang version 22.0.2' /tmp/compiler-version
          grep -F '15071444' /tmp/compiler-version
          echo "$CLANG_DIR" >> "$GITHUB_PATH"

      - name: Show Compiler Version
        run: clang --version

      - name: Integrate KernelSU Next
        if: ${{ env.ENABLE_KSU == 'true' }}
        run: |
          set -euo pipefail

          curl -fLSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            -o /tmp/ksu-setup.sh

          bash /tmp/ksu-setup.sh legacy

          echo "=== KernelSU Next version ==="
          git -C KernelSU-Next log -1 --oneline

          test -f drivers/kernelsu/Kconfig
          ls -la drivers/kernelsu

      - name: Configure Kernel
        run: |
          set -euo pipefail
          mkdir -p out

          cp "$RUNNER_TEMP/guam-original.config" out/.config

          if [ "$ENABLE_KSU" = "true" ]; then
            scripts/config --file out/.config \
              --enable KSU \
              --enable KPROBES \
              --enable KPROBE_EVENTS \
              --enable KSU_KPROBES_HOOK
          else
            scripts/config --file out/.config \
              --disable KSU
          fi

          make O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          echo "=== Touchscreen configuration ==="
          grep -Ei 'CONFIG_.*(HIMAX|ILI_9882|CHIPONE|NT36XXX|TOUCHSCREEN_MMI)' out/.config || true

          echo "=== Module and firmware configuration ==="
          grep -E 'CONFIG_(LOCALVERSION|MODULE|MODVERSIONS|FW_LOADER)' out/.config || true
          diff -u "$RUNNER_TEMP/guam-original.config" out/.config > /tmp/config.diff || true
          cat /tmp/config.diff

          echo "=== KernelSU configuration ==="
          grep -E 'CONFIG_KSU|CONFIG_KPROBE' out/.config || true

          if [ "$ENABLE_KSU" = "true" ]; then
            grep -qx 'CONFIG_KSU=y' out/.config
            grep -qx 'CONFIG_KPROBES=y' out/.config
            grep -qx 'CONFIG_KSU_KPROBES_HOOK=y' out/.config
          fi

      - name: Diagnose Android Vendor Hooks
        run: |
          echo "=== Vendor hook source files ==="
          find . -iname '*vendor*hook*' -o -iname '*hooks*.c'

          echo "=== Hook definitions ==="
          grep -Rns 'android_vh_set_memory_ro' \
            include drivers kernel arch || true

          echo "=== Hook configuration ==="
          grep -E 'CONFIG_ANDROID_VENDOR_HOOKS|CONFIG_TRACEPOINTS|CONFIG_ANDROID' \
            out/.config || true

      - name: Build Kernel
        run: |
          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbs modules

      - name: Check Device Tree Outputs
        run: |
          echo "=== Motorola base DTB ==="
          find out -name "bengal-moto-base.dtb"

          echo "=== Guam overlays ==="
          find out -name "bengal-guam-*.dtbo"

          echo "=== Device tree configuration ==="
          grep -E 'CONFIG_MMI_DEVICE_DTBS|CONFIG_GUAM_DTB|CONFIG_BUILD_ARM64_DT_OVERLAY' \
            out/.config || true

      - name: Collect Kernel Files
        run: |
          mkdir -p artifacts

          find out/arch/arm64/boot -type f \
            \( -name "Image" \
            -o -name "Image.gz" \
            -o -name "Image.gz-dtb" \
            -o -name "*.dtb" \
            -o -name "*.dtbo" \) \
            -exec cp --parents {} artifacts/ \;

          find out -type f -name '*.ko' -exec cp --parents {} artifacts/ \;
          cp out/.config artifacts/kernel.config
          cp "$RUNNER_TEMP/guam-original.config" artifacts/original.config
          cp /tmp/config.diff artifacts/config.diff
          cp out/System.map out/Module.symvers artifacts/
          cp out/include/config/kernel.release artifacts/
          find out -name "*himax*.ko" -print
          awk '$2 == "module_layout" {print "module_layout:", $1; if ($1 != "0x7b99c8ef") print "WARNING: original module_layout CRC differs"}' out/Module.symvers
          clang --version > artifacts/compiler.txt
          git rev-parse HEAD > artifacts/source-commit.txt
          echo "$ENABLE_KSU" > artifacts/kernelsu-enabled.txt

          test -s out/arch/arm64/boot/Image

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moto-E7-Plus-${{ inputs.build_name || 'Guam-Custom' }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 9
