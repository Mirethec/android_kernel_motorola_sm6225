name: Build Custom Moto E7 Plus Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        ref: lineage-24.0

    - name: Install Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex git-core gnupg gperf libssl-dev libxml2-utils lz4 zip unzip libncurses5 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi


    - name: Set up Clang Compiler
      uses: egor-tensin/setup-clang@v1
      with:
        version: 14

       

    - name: Build Kernel Binary
      run: |
           export ARCH=arm64
           export SUBARCH=arm64
           export CROSS_COMPILE=aarch64-linux-gnu-
           export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
           export CC=clang
           export KCFLAGS="-Wno-error"
        
           # Look inside the vendor subfolder for the config layout
           make O=out vendor/sm6225-perf_defconfig || make O=out vendor/bengal-perf_defconfig
        
           make -j$(nproc) O=out
           
    - name: Upload Kernel Output
      uses: actions/upload-artifact@v4
      with:
        name: Moto-E7-Plus-Overclocked-Kernel
        path: out/arch/arm64/boot/Image.gz-dtb
