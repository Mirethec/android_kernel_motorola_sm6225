name: Build Moto E7 Plus Kernel

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Kernel build name"
        required: false
        default: "Guam-Custom"
        type: string

  push:
    branches:
      - lineage-24.0

jobs:
  build:
    name: Build Kernel for Moto E7 Plus
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential \
            ccache curl flex git \
            libssl-dev libelf-dev \
            libncurses-dev lld llvm clang \
            python3 python3-pip \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            device-tree-compiler \
            llvm \
            zip unzip

      - name: Show Compiler Version
        run: clang --version

      - name: Configure Kernel
        run: |
          mkdir -p out
          make O=out ARCH=arm64 vendor/bengal_defconfig
          scripts/kconfig/merge_config.sh \
            -m -O out \
            out/.config \
            arch/arm64/configs/vendor/ext_config/guam-default.config
          make O=out ARCH=arm64 olddefconfig

          echo "=== Checking Android vendor hooks ==="
          grep CONFIG_ANDROID_VENDOR_HOOKS out/.config
      
      - name: Diagnose Android Vendor Hooks
        run: |
          echo "=== Vendor hook source files ==="
          find . -iname '*vendor*hook*' -o -iname '*hooks*.c'

          echo "=== Hook definitions ==="
          grep -Rns 'android_vh_set_memory_ro' include drivers kernel arch || true

          echo "=== Hook build configuration ==="
          grep -E 'CONFIG_ANDROID_VENDOR_HOOKS|CONFIG_TRACEPOINTS|CONFIG_ANDROID' out/.config || true

          echo "=== Android directory Makefile ==="
          if [ -f drivers/android/Makefile ]; then
            cat drivers/android/Makefile
          fi
      
      - name: Build Kernel
        run: |
          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbs

      - name: Collect Kernel Files
        run: |
          mkdir -p artifacts

          find out/arch/arm64/boot -type f \
            \( -name "Image" \
            -o -name "Image.gz" \
            -o -name "Image.gz-dtb" \
            -o -name "*.dtb" \
            -o -name "*.dtbo" \) \
            -exec cp --parents {} artifacts/ \;

          if [ -z "$(find artifacts -type f)" ]; then
            echo "No kernel output found!"
            exit 1
          fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moto-E7-Plus-${{ inputs.build_name || 'Guam-Custom' }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 9
