
name: Build Moto E7 Plus Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel defconfig path"
        required: true
        type: string
      build_name:
        description: "Kernel build name"
        required: false
        default: "Guam-Custom"
        type: string

  push:
    branches:
      - main

jobs:
  build:
    name: Build Kernel for Moto E7 Plus
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential \
            ccache curl flex git \
            libssl-dev libelf-dev \
            libncurses-dev lld llvm clang \
            python3 python3-pip \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            device-tree-compiler \
            zip unzip

      - name: Configure Kernel
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          mkdir -p out
          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "$DEFCONFIG"

      - name: Build Kernel
        env:
          BUILD_NAME: ${{ inputs.build_name }}
        run: |
          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbs

      - name: Collect Kernel Files
        run: |
          mkdir -p artifacts

          find out/arch/arm64/boot -type f \
            \( -name "Image" \
            -o -name "Image.gz" \
            -o -name "Image.gz-dtb" \
            -o -name "*.dtb" \
            -o -name "*.dtbo" \) \
            -exec cp --parents {} artifacts/ \;

          if [ -z "$(find artifacts -type f)" ]; then
            echo "No kernel output found!"
            exit 1
          fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moto-E7-Plus-${{ inputs.build_name || 'Guam-Custom' }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 9
